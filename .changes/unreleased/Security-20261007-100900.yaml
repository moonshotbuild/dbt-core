kind: Security
body: Percent-encode a package's `revision` in the GitHub archive URL (refusing `..`
    segments) and validate a `private:` slug's shape before it is interpolated into
    an SSH clone URL. Both were inserted raw, so a package could change the request
    rather than only name a ref or repository.
