kind: Security
body: Require a resource name to be a single name, not a path, and refuse to write
    synthesised snapshot SQL outside the target directory. A dependency's snapshot
    properties `name:` of `../../macros/x` was joined onto `target/snapshots` with no
    check on `dbt parse`, planting a macro in the root project that ran on the next
    compile.
