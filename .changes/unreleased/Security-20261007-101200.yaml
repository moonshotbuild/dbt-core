kind: Security
body: The `packages-install-path` containment check also resolves symlinks. A symlink
    inside the project (`project/link -> /outside`) made `link/pkgs` pass the lexical
    check while naming a directory outside the project, which `dbt deps` then removed
    wholesale and recreated.
