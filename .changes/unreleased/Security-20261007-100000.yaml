kind: Security
body: Pass `--` to `git fetch` and `git ls-remote` so a package's git URL or revision
    can no longer be parsed as a git option (a `revision` of `--upload-pack=<cmd>` ran
    `<cmd>` during `dbt deps`), and reject URLs and revisions that begin with `-`.
